<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Nunito',system-ui,sans-serif}
a{text-decoration:none}
input{font-family:inherit}
a,button{transition:transform .18s ease,box-shadow .22s ease,background-color .22s ease,border-color .22s ease,filter .22s ease;-webkit-tap-highlight-color:transparent}
a:active,button:active{transform:scale(.97)}
a:hover,button:hover{filter:brightness(1.04)}
.screen > *{animation:rise .5s cubic-bezier(.22,.7,.2,1) both}
.screen > *:nth-child(1){animation-delay:.02s}
.screen > *:nth-child(2){animation-delay:.07s}
.screen > *:nth-child(3){animation-delay:.12s}
.screen > *:nth-child(4){animation-delay:.17s}
.screen > *:nth-child(5){animation-delay:.22s}
.screen > *:nth-child(n+6){animation-delay:.26s}
.screen > .scrim{animation:fade .25s ease both}
.sheet{animation:slideUp .35s cubic-bezier(.22,.7,.2,1) both}
.pop{animation:pop .3s cubic-bezier(.22,.7,.2,1) both}
.float{animation:floaty 5s ease-in-out infinite}
.grow{transform-origin:left center;animation:grow .9s cubic-bezier(.22,.7,.2,1) .25s both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(4px) scale(.97)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="screen" style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px 24px 32px; background: #F5F3EC; color: #1F2D2B; display: flex; flex-direction: column; position: relative; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: flex-end; height: 48px">
<a href="Offer.dc.html" style="display: flex; align-items: center; min-height: 44px; padding: 0 4px; color: #5B6B67; font-size: 16px; font-weight: 700">Skip for now</a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<h1 style="margin: 0; font-size: 30px; line-height: 1.15; font-weight: 800">Hi! Who are you?</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #5B6B67">This shows on the receipts you send, so your friends know who to pay.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px; margin-top: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="name" style="font-size: 15px; font-weight: 800">Name or nickname</label>
<div style="position: relative; display: flex; align-items: center"><span style="position: absolute; left: 16px; display: flex; color: #17574E"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><circle cx="12" cy="8" r="3.6"/><path d="M5 20C5 16 8 14 12 14S19 16 19 20"/></svg></span><input id="name" type="text" placeholder="e.g. Migs" style="box-sizing: border-box; width: 100%; height: 56px; padding: 0 16px 0 50px; border: 2px solid #1A6F63; border-radius: 16px; background: #FFFFFF; font-size: 18px; font-weight: 600; color: #1F2D2B; outline: none"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 800">Where do you get paid? <span style="font-weight: 600; color: #5B6B67">(optional)</span></span>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="5">
<sc-if value="{{ m.sel }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="true" onClick="{{ m.pick }}" style="min-height: 44px; padding: 0 18px; border: 2px solid #1A6F63; border-radius: 22px; background: #DCEFEA; color: #17574E; font-family: inherit; font-size: 16px; font-weight: 800; cursor: pointer">{{ m.label }}</button>
</sc-if>
<sc-if value="{{ m.unsel }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-pressed="false" onClick="{{ m.pick }}" style="min-height: 44px; padding: 0 18px; border: 2px solid #D9E2DF; border-radius: 22px; background: #FFFFFF; color: #1F2D2B; font-family: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{ m.label }}</button>
</sc-if>
</sc-for>
</div>
</div>
<sc-if value="{{ showAcct }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="acct" style="font-size: 15px; font-weight: 800">{{ acctLabel }}</label>
<div style="position: relative; display: flex; align-items: center"><span style="position: absolute; left: 16px; display: flex; color: #17574E"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10H21M16 14.5H16.1"/></svg></span><input id="acct" type="text" inputmode="numeric" placeholder="{{ acctHint }}" style="box-sizing: border-box; width: 100%; height: 56px; padding: 0 16px 0 50px; border: 2px solid #D9E2DF; border-radius: 16px; background: #FFFFFF; font-size: 18px; font-weight: 600; color: #1F2D2B; outline: none"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 800">Payment QR <span style="font-weight: 600; color: #5B6B67">(optional)</span></span>
<button type="button" style="display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 0 16px; border: 2px dashed #A9BDB8; border-radius: 16px; background: #FFFFFF; font-family: inherit; text-align: left; color: #1F2D2B">
<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="3" width="14" height="14" rx="3" fill="none" stroke="#1A6F63" stroke-width="3"/><rect x="23" y="3" width="14" height="14" rx="3" fill="none" stroke="#1A6F63" stroke-width="3"/><rect x="3" y="23" width="14" height="14" rx="3" fill="none" stroke="#1A6F63" stroke-width="3"/><path d="M24 24H29M33 24H36M24 30H27M31 30V36M36 29V36" stroke="#1A6F63" stroke-width="3" stroke-linecap="round"/></svg>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 800">Upload your QR</span><span style="font-size: 14px; font-weight: 600; color: #5B6B67">It will appear on your receipts so friends can scan and pay</span></span>
</button>
</div>
</sc-if>
<div style="display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; background: #E8F2EE; border-radius: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px"><rect x="5" y="11" width="14" height="10" rx="3" fill="#1A6F63"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="#1A6F63" stroke-width="2.5" stroke-linecap="round"/></svg>
<span style="font-size: 15px; line-height: 1.45; color: #31403D">Saved only on your phone. It isn&rsquo;t sent anywhere.</span>
</div>
</div>
<div style="flex: 1"></div>
<a href="Offer.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; border-radius: 16px; background: #1A6F63; color: #FFFFFF; font-size: 18px; font-weight: 800; box-shadow: 0 4px 14px rgba(26,111,99,0.22);">Continue<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M5 12H19M13 6L19 12L13 18"/></svg></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
state = { method: 'gcash' };
renderVals() {
const list = [
{ id: 'gcash', label: 'GCash', acct: 'GCash number', hint: '09XX XXX XXXX' },
{ id: 'maya', label: 'Maya', acct: 'Maya number', hint: '09XX XXX XXXX' },
{ id: 'maribank', label: 'MariBank', acct: 'MariBank account number', hint: 'Account number' },
{ id: 'bank', label: 'Bank', acct: 'Bank account number', hint: 'Account number' },
{ id: 'cash', label: 'Cash only', acct: '', hint: '' }
];
const cur = list.find((x) => x.id === this.state.method) || list[0];
return {
methods: list.map((x) => ({
label: x.label,
sel: x.id === cur.id,
unsel: x.id !== cur.id,
pick: () => this.setState({ method: x.id })
})),
showAcct: cur.id !== 'cash',
acctLabel: cur.acct,
acctHint: cur.hint
};
}
}
</script>
</body>
</html>
